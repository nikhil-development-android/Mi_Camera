steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 11
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '11'

  - name: Show directory
    run: dir

  - name: Build APK with build.bat
    working-directory: App
    run: |
      echo Running build.bat non-interactively
      echo 1|build.bat

  - name: List output
    run: |
      dir App\out || echo "out folder not present"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: MiuiCamera-apk
      path: App/out/*.apk
